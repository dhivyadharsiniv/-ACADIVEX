<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none">
  <defs>
    <linearGradient id="acadivex-violet" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#A78BFA"/>
      <stop offset="60%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#5B21B6"/>
    </linearGradient>
    <linearGradient id="acadivex-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#67E8F9"/>
      <stop offset="50%" stop-color="#06B6D4"/>
      <stop offset="100%" stop-color="#0891B2"/>
    </linearGradient>
    <linearGradient id="acadivex-glow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C084FC"/>
      <stop offset="50%" stop-color="#7C3AED"/>
      <stop offset="100%" stop-color="#06B6D4"/>
    </linearGradient>
    <linearGradient id="acadivex-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E1B4B"/>
      <stop offset="50%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#0B0F19"/>
    </linearGradient>
    <filter id="acadivex-shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#7C3AED" flood-opacity="0.5"/>
    </filter>
  </defs>
  
  <!-- Midnight Navy Squircle Container -->
  <rect width="120" height="120" rx="28" fill="url(#acadivex-bg)"/>
  <rect x="1.5" y="1.5" width="117" height="117" rx="26.5" stroke="url(#acadivex-glow)" stroke-width="2" stroke-opacity="0.6"/>
  
  <!-- Geometric "A" Ambition Wings -->
  <!-- Left Wing (Electric Violet) -->
  <path d="M 60 21 L 45 21 L 22 96 L 39 96 L 48 68 L 60 68 Z" fill="url(#acadivex-violet)" filter="url(#acadivex-shadow)"/>
  
  <!-- Right Wing (Vibrant Cyan) -->
  <path d="M 60 21 L 75 21 L 98 96 L 81 96 L 72 68 L 60 68 Z" fill="url(#acadivex-cyan)" filter="url(#acadivex-shadow)"/>
  
  <!-- Ambition Pinnacle (North Star) -->
  <polygon points="60,17 68,28 60,38 52,28" fill="#F8FAFC"/>
  
  <!-- Interconnected Smart Digital Beam -->
  <path d="M 39 63 L 81 63 L 74 74 L 46 74 Z" fill="url(#acadivex-glow)"/>
  
  <!-- Core Network Node -->
  <circle cx="60" cy="68.5" r="4.5" fill="#FFFFFF"/>
  <circle cx="60" cy="68.5" r="7.5" stroke="#22D3EE" stroke-width="1.8" stroke-opacity="0.9"/>
</svg>
